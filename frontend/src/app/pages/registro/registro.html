<div class="registro-container">
    <h1>Registro</h1>
    <form (ngSubmit)="registro()">
        
        <div class="input-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required placeholder="Tu nombre">
        </div>

        <div class="input-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" [(ngModel)]="apellido" required placeholder="Tu apellido">
        </div>

        <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="tu@correo.com">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••">
        </div>

        <div class="acciones">
            <button type="submit" class="btn-principal">Registrarse</button>
            <button type="button" class="btn-secundario" (click)="irAlLogin()">Volver al inicio</button>
        </div>

    </form>
</div>
