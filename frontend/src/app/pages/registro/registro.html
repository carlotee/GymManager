<div class="registro-container">
    <h1>Registro</h1>
    <form (ngSubmit)="registro()">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required>

        <br><br>

        <!-- NUEVO CAMPO: Apellido -->
        <label for="apellido">Apellido: </label>
        <input type="text" id="apellido" name="apellido" [(ngModel)]="apellido" required>

        <br><br>

        <label for="email">Correo: </label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required>

        <br><br>

        <label for="password">Contraseña: </label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required>

        <br><br>

        <button type="submit">Registrarse</button>
        <button type="button" (click)="irAlLogin()">Volver al inicio</button>
    </form>
</div>
