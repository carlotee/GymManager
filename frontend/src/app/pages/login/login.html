<div class="login-container">
    <h1>Inicio de sesión</h1>
    <form (ngSubmit)="login()">
        
        <div class="input-group">
            <label for="email">Correo:</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="tu@correo.com">
        </div>

        <div class="input-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••">
        </div>

        <div class="acciones">
            <button type="submit" class="btn-principal">Iniciar sesión</button>
            <button type="button" class="btn-secundario" (click)="irAlRegistro()">Registrarse</button>
        </div>

    </form>
</div>
